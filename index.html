<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dental Invoice System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
 
    .container {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-start;
      width: 90%;
      gap: 0px;
      margin-top: 5px;
    }
 
    .form-container, .preview-container {
      width: 45%;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f9f9f9;
      box-sizing: border-box;
    }
 
    .form-container input, .form-container textarea, .form-container select {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
 
    .preview-container {
      background: white;
      min-height: 500px;
      position: relative;
    }
 
    /* Letter_Pad.jpg is 2481 x 3508 (ratio 0.7072) - aspect-ratio matches
       the real file exactly so there's no leftover blank strip at the
       bottom of exported images. */
    .invoice {
      font-family: monospace;
      width: 800px;
      aspect-ratio: 2481 / 3508;
      position: relative;
      background: url('Letter_Pad.jpg') no-repeat center top;
      background-size: contain;
      background-color: white;
      margin: 0 auto;
    }
 
    .field {
      position: absolute;
      font-size: 18px;
      color: #222;
      white-space: pre;
    }
 
    /* Field positions - calibrated against Letter_Pad.jpg at 800px render width */
    #previewInvoiceNumber { left: 665px; top: 150px; }
    #previewDate { left: 600px; top: 190px; }
    #previewPatientName { left: 155px; top: 335px; }
    #previewAge { left: 155px; top: 370px; }
    #previewSex { left: 295px; top: 370px; }
    #previewPtMobNo { left: 478px; top: 370px; }
    #previewAddress {
      left: 155px;
      top: 405px;
      max-width: 600px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 16px;
    }
    #previewTotal { left: 590px; top: 955px; font-weight: bold; }
 
    .service-row-field {
      left: 65px;
      font-size: 16px;
    }
 
    .generate-btn {
      margin-top: 20px;
      margin-right: 10px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
 
    .generate-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
<h1>Dental Invoice System</h1>
<div class="container">
  <!-- Input Form -->
  <div class="form-container">
    <h2>Input Details</h2>
    <label>Invoice Number</label>
    <input type="text" id="invoiceNumber" placeholder="Enter Invoice Number">
    <label>Date</label>
    <input type="date" id="date" value="">
    <label>Patient Name</label>
    <input type="text" id="patientName" placeholder="Enter Patient Name">
    <label>Age</label>
    <input type="number" id="age" placeholder="Enter Age" min="0">
    <label>Sex</label>
    <select id="sex">
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>
    <label>Pt. Mobile No.</label>
    <input type="tel" id="ptMobNo" placeholder="Enter Patient Mobile No.">
    <label>Address</label>
    <textarea id="address" placeholder="Enter Address"></textarea>
 
    <h3>Services</h3>
    <div id="services">
      <div class="service-row">
        <input type="text" class="description" placeholder="Description">
        <input type="number" class="quantity" placeholder="Qty" value="1" min="0">
        <input type="number" class="price" placeholder="Price" value="0" min="0">
      </div>
    </div>
    <button type="button" onclick="addService()">Add Service</button>
  </div>
 
  <!-- Invoice Preview -->
  <div class="preview-container">
    <div id="invoicePreview" class="invoice">
      <span id="previewInvoiceNumber" class="field"></span>
      <span id="previewDate" class="field"></span>
      <span id="previewPatientName" class="field"></span>
      <span id="previewAge" class="field"></span>
      <span id="previewSex" class="field"></span>
      <span id="previewPtMobNo" class="field"></span>
      <span id="previewAddress" class="field"></span>
      <div id="servicePreviewFields"></div>
      <span id="previewTotal" class="field"></span>
    </div>
  </div>
</div>
 
<!-- Buttons -->
<div style="margin: 20px;">
  <button class="generate-btn" onclick="generateImage()">Generate Invoice Image</button>
  <button class="generate-btn" onclick="generatePNGImage()">Generate PNG Image</button>
  <button class="generate-btn" onclick="resetForm()">Reset</button>
</div>
 
<script>
  // Row layout for the services table (calibrated against Letter_Pad.jpg)
  const SERVICE_START_TOP = 500;
  const SERVICE_ROW_HEIGHT = 32;
 
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
 
  function createServiceRow() {
    const row = document.createElement('div');
    row.className = 'service-row';
    row.innerHTML = `
      <input type="text" class="description" placeholder="Description">
      <input type="number" class="quantity" placeholder="Qty" value="1" min="0">
      <input type="number" class="price" placeholder="Price" value="0" min="0">
    `;
    row.querySelectorAll('input').forEach(input => input.addEventListener('input', updatePreview));
    return row;
  }
 
  function updatePreview() {
    document.getElementById('previewInvoiceNumber').innerText = document.getElementById('invoiceNumber').value;
 
    const dateVal = document.getElementById('date').value;
    document.getElementById('previewDate').innerText = dateVal
      ? dateVal.split('-').reverse().join('-')
      : '';
 
    document.getElementById('previewPatientName').innerText = document.getElementById('patientName').value;
    document.getElementById('previewAge').innerText = " " + document.getElementById('age').value;
    document.getElementById('previewSex').innerText = " " + document.getElementById('sex').value;
    document.getElementById('previewPtMobNo').innerText = " " + document.getElementById('ptMobNo').value;
 
    // Letter_Pad.jpg only has one printed "ADD. :" line, so multi-line
    // input gets condensed onto a single line instead of wrapping.
    const addressValue = document.getElementById('address').value
      .trim()
      .split('\n')
      .map(l => l.trim())
      .filter(Boolean)
      .join(', ');
    document.getElementById('previewAddress').innerText = addressValue;
 
    const services = document.querySelectorAll('.service-row');
    const previewContainer = document.getElementById('servicePreviewFields');
    previewContainer.innerHTML = '';
 
    let total = 0;
 
    services.forEach((row, i) => {
      const desc = row.querySelector('.description').value;
      const qty = parseInt(row.querySelector('.quantity').value) || 0;
      const price = parseFloat(row.querySelector('.price').value) || 0;
      const sub = qty * price;
      total += sub;
 
      const span = document.createElement('span');
      span.className = 'field service-row-field';
      span.style.top = (SERVICE_START_TOP + i * SERVICE_ROW_HEIGHT) + 'px';
      span.innerText = `${desc.padEnd(36)} ${qty.toString().padEnd(5)} ₹${price.toFixed(2).padEnd(8)} ₹${sub.toFixed(2)}`;
      previewContainer.appendChild(span);
    });
 
    document.getElementById('previewTotal').innerText = " ₹" + total.toFixed(2);
  }
 
  function addService() {
    const services = document.getElementById('services');
    const row = createServiceRow();
    services.appendChild(row);
    updatePreview();
  }
 
  function generateImage() {
    const invoice = document.getElementById('invoicePreview');
    html2canvas(invoice, { scale: 2 }).then(canvas => {
      const link = document.createElement('a');
      link.download = `ProDentalCare_Invoice_${document.getElementById('invoiceNumber').value || '000'}.jpg`;
      link.href = canvas.toDataURL('image/jpeg');
      link.click();
    }).catch(err => {
      alert('Could not generate the invoice image. Please try again.');
      console.error(err);
    });
  }
 
  function generatePNGImage() {
    const invoice = document.getElementById('invoicePreview');
    html2canvas(invoice, { scale: 4, letterRendering: true }).then(canvas => {
      const link = document.createElement('a');
      link.download = `ProDentalCare_Invoice_${document.getElementById('invoiceNumber').value || '000'}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(err => {
      alert('Could not generate the invoice image. Please try again.');
      console.error(err);
    });
  }
 
  function resetForm() {
    document.getElementById('invoiceNumber').value = '';
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    document.getElementById('patientName').value = '';
    document.getElementById('age').value = '';
    document.getElementById('sex').value = 'Male';
    document.getElementById('ptMobNo').value = '';
    document.getElementById('address').value = '';
 
    const services = document.getElementById('services');
    services.innerHTML = '';
    services.appendChild(createServiceRow());
 
    updatePreview();
  }
 
  document.querySelectorAll('input, textarea, select').forEach(input =>
    input.addEventListener('input', updatePreview)
  );
 
  updatePreview(); // Initial run
</script>
</body>
</html>
